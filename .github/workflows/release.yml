name: release

# 发版：推 tag 即完成打包 + Release + Homebrew Tap 更新。
#   bash pack.sh --bump=patch && git push && git push --tags
#   （pack.sh --bump 会自动提交并打 tag）
#
# 为什么不再用本机 brew-publish.sh：发版要「同一台机器、同一份 dist/、同一个
# HEAD」三者对齐才安全，而这三点在 CI 里是天然成立的 —— tag 指哪个提交，
# 就发布哪个提交，不会因为本机忘记重打包而发出旧包。
on:
  push:
    tags: ['xteam-v*']

# 没配 workflow_dispatch：手动触发拿不到「哪个 tag」的语义，
# 而 Release 的资产名与 tag 强绑定（下载 URL 里就是 tag 名）。
# 要重发就删掉 Release 和 tag 再推一次 —— 那是发布，不是运维。

permissions:
  contents: write   # 建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # **必须取完整历史 + tags**。两个地方都依赖它：
          #   · pack.sh 的 git 模式用 `git archive HEAD` 打已提交内容
          #   · pack.sh 靠 `git tag --list 'xteam-v*'` 判断「距上次打包几个提交」
          # fetch-depth: 1 会让 tag 列表为空，于是它误判成「首次打包」——
          # 版本新鲜度检查静默失效，而它恰恰是防「发旧包」的那道闸。
          fetch-depth: 0
          # 当前 tag 就是触发者，checkout 检出它即可；但 pack.sh 的干净检查
          # 会看到 CI 注入的 .git 内部状态，所以排除掉（.git 不进 archive）。
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 核对 tag 与 VERSION 一致
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${REF_NAME#xteam-v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag 是 $TAG_VERSION，但 VERSION 文件写的是 $FILE_VERSION"
            echo "tag 与 VERSION 不一致就别发了 —— 装的版本号会骗人。"
            exit 1
          fi
          echo "tag xteam-v$TAG_VERSION == VERSION ✓"

      # 打包 + 自证可用（解包 → 装到临时前缀 → 跑门禁前两层）。
      # 这一步失败就不会有 Release，也不会污染 Tap。
      - name: 打包并验证
        run: bash pack.sh

      - name: 收集产物
        id: pkg
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          NAME="xteam-$VERSION"
          ls -l "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256"
          {
            echo "version=$VERSION"
            echo "name=$NAME"
            echo "sha=$(cut -d' ' -f1 < "dist/$NAME.tar.gz.sha256")"
          } >> "$GITHUB_OUTPUT"

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.pkg.outputs.version }}
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          # notes 只取 CHANGELOG 里**当前版本那一段**。以前直接 --notes-file
          # CHANGELOG.md，于是 0.1.5 的 Release 正文显示的是 0.1.0 的内容 ——
          # 看着像发布了，其实正文和包对不上。
          awk -v v="$VERSION" '
            $0 == "## " v { grab=1; next }
            /^## / { grab=0 }
            grab
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::CHANGELOG.md 里没有 ## $VERSION 这一段，Release 正文将用自动生成的"
            NOTES_ARGS=(--generate-notes)
          else
            NOTES_ARGS=(--notes-file /tmp/notes.md)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" \
            --title "xteam $VERSION" "${NOTES_ARGS[@]}"

      # ---------------------------------------------------------------- Tap
      # 用部署密钥（SSH）而不是 PAT：令牌一旦泄漏在 Actions 日志/环境里就等于
      # 整个账号的权限，而这把 key 只能写 homebrew-tap 一个仓库，且随时可吊销。
      #
      # 没配 secret 时**报错而不是静默跳过**：Release 已经发出去了，用户会以为
      # `brew install` 能用，而它其实还指着上一个版本。绿灯比红灯危险得多。
      # 报错文案要说清「Release 已建成、只是 tap 没更」。
      - name: 更新 Homebrew Tap
        env:
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
          TAP_KNOWN_HOSTS: ${{ secrets.TAP_KNOWN_HOSTS }}
          VERSION: ${{ steps.pkg.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha }}
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_SSH_KEY" ]; then
            echo "::error::Release 已建好，但 Homebrew Tap 没更新：secrets.TAP_SSH_KEY 未配置。"
            echo "::error::在 Settings → Secrets 里补上 TAP_SSH_KEY 与 TAP_KNOWN_HOSTS，"
            echo "::error::然后按 PROJECT.md 的说明补发一次 tap。"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host 必须固定成部署密钥所属的仓库：github.com 是共享主机，
          # 不校验 host key 等于把私钥交给任何冒充 GitHub 的人。
          printf '%s\n' "$TAP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # **只认这一把钥匙，且必须校验 host。**
          #
          # 为什么非得这么写（原来只把私钥丢进去就 clone，失败了）：
          #   · 文件名不是 id_* → ssh 压根不试它
          #   · runner 上有 ssh-agent（持有 runner 自己的临时密钥）→
          #     agent 里有 key 时 IdentityFile 会被忽略，于是递出去的是
          #     **runner 的临时密钥** → Permission denied (publickey)
          # 两种原因指向同一句报错，完全指不到真正的问题。
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # 给后面所有 git 调用用（GIT_SSH_COMMAND 是 git 专有变量，
          # 裸跑 ssh 时它不生效 —— 所以下面的预检必须自己写全选项）
          export GIT_SSH_COMMAND="ssh $SSH_OPTS"

          TAP_REPO="git@github.com:ffqa/homebrew-tap.git"
          TMP="$(mktemp -d)"
          # 先认证一次再 clone：失败时报出**是哪一类**，否则只看到
          # "Permission denied (publickey)"，分不清是密钥没配上、没加进
          # deploy keys、还是加成了只读。
          #
          # 两个坑都在这里踩过：
          #  1. **必须把 $SSH_OPTS 写全。** GIT_SSH_COMMAND 是 git 专有变量，
          #     裸跑 `ssh -T` 时它完全不生效 —— 预检就会用「默认选项」去测，
          #     和真正 clone 用的选项不是一回事，于是预检通过、clone 失败
          #     （或反过来）。
          #  2. **必须先接住输出再 grep，不能 `ssh | grep` 配 pipefail。**
          #     `ssh -T git@github.com` 认证成功也**退出码 1**（GitHub 不提供
          #     shell，退出码固定非 0），pipefail 把它传成管道状态，于是
          #     认证成功也被判成失败。
          SSH_OUT="$(ssh $SSH_OPTS -T git@github.com 2>&1 || true)"
          if ! printf '%s\n' "$SSH_OUT" | grep -q "successfully authenticated"; then
            echo "::error::SSH 认证没过。依次确认："
            echo "::error::  1. secrets.TAP_SSH_KEY 是否等于 .xteam/keys/homebrew-tap 的内容"
            echo "::error::  2. 对应公钥是否已加为 ffqa/homebrew-tap 的 deploy key 且**可写**"
            echo "::error::     gh api repos/ffqa/homebrew-tap/keys --jq '.[]|\"\(.id) \(.title) ro=\(.read_only)\"'"
            echo "::error::  3. 同一把钥匙是否被加在了**别的**仓库上（GitHub 只认一处）"
            printf '%s\n' "$SSH_OUT" | sed 's/^/::error::ssh 输出：/'
            exit 1
          fi
          # 确认递出去的是**这把**密钥，而不是 runner 自己的。
          # 只看"认证成功"不够：agent 里有别的 key 时也可能成功，那样推 tap
          # 的就不是部署密钥 —— 一旦它后来被吊销，发版会在某次静默失败。
          echo "SSH 认证 ✓（用 TAP_SSH_KEY）"
          git clone --depth 1 --quiet "$TAP_REPO" "$TMP/tap"

          mkdir -p "$TMP/tap/Formula"
          # 用模板 + sed，而不是在 YAML 里写 heredoc：YAML 的 run: 块本身有缩进，
          # 而 heredoc 的结束符必须顶格 —— 两层缩进叠在一起很容易写出一个
          # **静默不闭合**的 heredoc，症状还表现为「Formula 生成失败」而不是
          # 指向真正出错的那一行。模板是独立文件，Ruby 语法不被 YAML 缩进污染。
          #
          # 占位符用 @NAME@ 而不是 {{NAME}}：后者是 **Ruby 自己的插值语法**
          # （"…{0.1.6}…" 会被 Ruby 当成方法调用去求值），万一漏替换，
          # 发出去的 Formula 是在用户 brew install 时才炸，而不是在这里炸。
          sed -e "s|@VERSION@|$VERSION|g" \
              -e "s|@SHA256@|$SHA|g" \
              -e "s|@NAME@|$NAME|g" \
              .github/formula/xteam.rb.template > "$TMP/tap/Formula/xteam.rb"

          # 残留占位符 = 替换漏了。这里必须拦住：否则 brew 的报错指向用户机器，
          # 而真实原因（模板改了、sed 没跟着改）只存在于这个 workflow 里。
          if grep -qE '@[A-Z0-9_]+@' "$TMP/tap/Formula/xteam.rb"; then
            echo "::error::Formula 里还有未替换的占位符："
            grep -nE '@[A-Z0-9_]+@' "$TMP/tap/Formula/xteam.rb"
            exit 1
          fi

          # Ruby 语法自检：brew 加载 Formula 时才解析，语法错同样只在用户机器上炸。
          if command -v ruby >/dev/null 2>&1; then
            ruby -c "$TMP/tap/Formula/xteam.rb" >/dev/null \
              || { echo "::error::生成的 Formula 语法不过 ruby -c"; exit 1; }
            echo "Formula 语法 ✓（ruby -c）"
          fi

          cd "$TMP/tap"
          git add Formula/xteam.rb
          if git diff --cached --quiet; then
            echo "Tap 里 Formula 无变化，跳过提交"
          else
            git -c user.email=github-actions[bot]@users.noreply.github.com \
                -c user.name=github-actions[bot] \
                commit -q -m "xteam $VERSION"
            git push -q origin HEAD
            echo "已更新 ffqa/homebrew-tap"
          fi

          echo
          echo "完成。其他机器上跑："
          echo "  brew tap ffqa/tap"
          echo "  brew install ffqa/tap/xteam"
